services:
  mastra:
    build: .
    ports:
      - "4111:4111"
    env_file:
      - .env
    environment:
      LMSTUDIO_BASE_URL: "http://host.docker.internal:1234/v1"
      OUTPUT_ROOT: "/data/output"
      DOCUMENTS_DIR: "/data/odl"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mastra-data:/data
      - ./src/docs/odl:/data/odl

volumes:
  mastra-data:
